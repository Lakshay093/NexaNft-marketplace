services:
  - type: web
    name: nexanft-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev --workspace=@nexanft/server --workspace=@nexanft/contracts --include-workspace-root && npm run build -w @nexanft/server
    preDeployCommand: npm run db:migrate -w @nexanft/server
    startCommand: npm start -w @nexanft/server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY
        value: '1'
      - key: ENABLE_DEMO_TRANSFERS
        value: 'false'
      - key: STORAGE_DRIVER
        value: s3
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_PUBLIC_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RESET_URL
        value: nexanft://reset-password
